name: CI

on:
  pull_request:
  push:
    branches: [main]
  # release.yml runs this whole workflow as its gate, so a tag ships only what CI accepts.
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      # The distill-lab script tests run with Node; fail instead of skipping when it is missing.
      SKILLSTATION_REQUIRE_NODE: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.10"
      # The oldest Node the distill-lab script supports; no runner image ships it.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 18
      - name: Test
        run: go test -timeout 30m ./...
      - name: Race test
        run: go test -race -timeout 30m ./...
      - name: Performance budgets
        shell: bash
        env:
          SKILLSTATION_PERF: "1"
        run: go test -p 1 -count=1 -run 'Performance' ./...
      - name: Vet
        run: go vet ./...

  # The Windows suite is dominated by file creation, fsync and process spawns and
  # ran 53 minutes as one job, mostly in three packages. Each group is a job of
  # its own so the groups run side by side; "rest" is every package no other
  # group names, so a new package is tested without touching this list.
  verify-windows:
    name: Verify (windows-latest, ${{ matrix.group }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        group: [cli, mcpserver, app-web, rest]
    env:
      SKILLSTATION_REQUIRE_NODE: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.10"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 18
      # GitHub's Windows runners keep %TEMP% and the Go build cache on the slow
      # C: drive and scan every new file with Defender. Keep scratch files on
      # the D: work drive and exclude them from real-time scanning.
      - name: Fast scratch space
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force D:\tmp, D:\gocache | Out-Null
          "TMP=D:\tmp" >> $env:GITHUB_ENV
          "TEMP=D:\tmp" >> $env:GITHUB_ENV
          "GOCACHE=D:\gocache" >> $env:GITHUB_ENV
          try { Add-MpPreference -ExclusionPath 'D:\tmp','D:\gocache',"$env:GITHUB_WORKSPACE" } catch { Write-Warning "Defender exclusion not applied: $_" }
      - name: Test (with per-test timings)
        shell: bash
        env:
          GROUP: ${{ matrix.group }}
        run: |
          case "$GROUP" in
            cli) pkgs="./internal/delivery/cli/..." ;;
            mcpserver) pkgs="./internal/delivery/mcpserver/..." ;;
            app-web) pkgs="./internal/app/... ./internal/delivery/web/..." ;;
            rest) pkgs="$(go list ./... | grep -v -E '/internal/(app|delivery/(cli|mcpserver|web))(/|$)')" ;;
          esac
          go test -v -timeout 60m $pkgs 2>&1 | tee "$RUNNER_TEMP/go-test.log"
          exit "${PIPESTATUS[0]}"
      - name: Slowest tests
        if: always()
        shell: bash
        run: |
          grep -E '^\s*--- (PASS|FAIL): ' "$RUNNER_TEMP/go-test.log" | sed -E 's/.*--- (PASS|FAIL): (\S+) \(([0-9.]+)s\).*/\3 \2/' | sort -rn | head -40 || true
      - name: Performance budgets
        if: matrix.group == 'rest'
        shell: bash
        env:
          SKILLSTATION_PERF: "1"
        run: go test -p 1 -count=1 -run 'Performance' ./...
      - name: Vet
        if: matrix.group == 'rest'
        run: go vet ./...

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.10"
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l cmd internal schemas)"

  lint:
    name: Lint (new issues)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.10"
      # A tag push or a manual release run has no usable "before" revision (it is
      # empty or all zeros), so lint what changed since the previous release tag.
      - name: golangci-lint on changes since the base revision
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          base="$BASE_SHA"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git describe --tags --abbrev=0 --match 'v*.*.*' HEAD^ 2>/dev/null || git rev-parse HEAD^)"
          fi
          echo "Linting new issues since $base"
          make lint LINT_BASE="$base"
      - name: No new unreachable functions
        run: make deadcode
      - name: Known vulnerabilities
        run: make vulncheck
      # Every system skill file a release tag shipped must stay recognized; needs the tags fetched above.
      - name: Shipped system skill digests
        env:
          SKILLSTATION_REQUIRE_TAGS: "1"
        run: go test -count=1 -run 'CoverReleased' ./internal/systemskills/... ./internal/hostintegration/...

  installer-lifecycle:
    name: Installer lifecycle
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Check shell syntax
        shell: bash
        run: bash -n scripts/install.sh
      - name: Test install, upgrade, rollback, and uninstall
        shell: bash
        run: scripts/test-installer-lifecycle.sh

  installer-windows:
    name: Windows installer lifecycle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Test Windows installer
        shell: pwsh
        run: scripts/test-installer-windows.ps1
      # README tells Windows users to run the one-liner in Windows PowerShell 5.1, which
      # is not pwsh: curl is an alias there, and the installer once stopped on it.
      - name: Test the one-liner in Windows PowerShell 5.1
        shell: powershell
        run: scripts/test-installer-oneliner.ps1

  fuzz:
    name: Bounded fuzz (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: canonical
            package: ./internal/canonical
            target: FuzzCanonicalParsersAndPaths
          - name: mutation
            package: ./internal/mutation
            target: FuzzMutationPathConfinement
          - name: mcpserver
            package: ./internal/delivery/mcpserver
            target: FuzzMCPFrameAndInputHelpers
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.10"
      - name: Fuzz ${{ matrix.name }}
        run: go test ${{ matrix.package }} -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime=15s -timeout=3m

  web:
    name: Web UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.10"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
      # make web-check also fails when web/THIRD_PARTY_NOTICES.md is stale.
      - name: Frontend checks and build
        run: make web-check
      - name: Install Playwright browsers
        run: npx --prefix web playwright install --with-deps chromium
      - name: E2E smoke tests
        run: make web-e2e
      # After the e2e build, which empties the folder; release.yml embeds and attaches this file.
      - name: Embed third-party notices in the web UI
        run: cp web/THIRD_PARTY_NOTICES.md internal/delivery/web/dist/THIRD_PARTY_NOTICES.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-dist
          path: internal/delivery/web/dist
          if-no-files-found: error

  cross-compile:
    name: Cross-compile smoke check
    needs: web
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.10"
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: web-dist
          path: internal/delivery/web/dist
      - name: Build ${{ matrix.target.goos }}/${{ matrix.target.goarch }}
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
        run: go build -o skillstation-${{ matrix.target.goos }}-${{ matrix.target.goarch }} ./cmd/skillstation
