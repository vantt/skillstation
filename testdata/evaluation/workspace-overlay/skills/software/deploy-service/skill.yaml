schema_version: 1
routing:
    operations: [operate]
    triggers: [deploy application service production]
    not_for: [unrelated tasks]
    min_scope: multi_step
    examples:
        - deploy application container to kubernetes cluster
        - roll out service release to production
        - configure deployment pipeline for web service
    counter_examples:
        - review code diff in pull request
        - design database table index
